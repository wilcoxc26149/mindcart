name: mindcart

services:
  falkordb:
    image: falkordb/falkordb:v4.20.4
    ports:
      # Offset from cognee_falkordb (host 6380 / UI 3000) so both stacks can run.
      # In-container both Falkor and Redis still listen on 6379.
      - "6382:6379"
      - "3001:3000" # FalkorDB Browser UI
    # AOF so writes land on disk inside the mounted data dir (not only RAM)
    environment:
      REDIS_ARGS: "--appendonly yes"
    volumes:
      # Canonical path — do NOT mount /data (symlink; volume stays empty)
      - falkordb_data:/var/lib/falkordb/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:0.8.6-pg16
    environment:
      POSTGRES_USER: cognee
      POSTGRES_PASSWORD: cognee
      POSTGRES_DB: cognee
    ports:
      - "5433:5432" # offset from cognee_falkordb host 5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-pgvector.sql:/docker-entrypoint-initdb.d/01-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cognee -d cognee"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # Session cache — host 6381 (cognee_falkordb keeps standard 6379).
  redis:
    image: redis:8.10.1-alpine
    ports:
      - "6381:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  cognee:
    build:
      context: ./docker/cognee
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      LLM_API_KEY: ${LLM_API_KEY:?set LLM_API_KEY in .env}
      ENABLE_BACKEND_ACCESS_CONTROL: "false"
      REQUIRE_AUTHENTICATION: "false"
      CACHING: "true"
      CACHE_BACKEND: redis
      CACHE_HOST: redis
      CACHE_PORT: "6379"
      DB_PROVIDER: postgres
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USERNAME: cognee
      DB_PASSWORD: cognee
      DB_NAME: cognee
      GRAPH_DATABASE_PROVIDER: falkor
      GRAPH_DATABASE_URL: falkordb
      GRAPH_DATABASE_PORT: "6379"
      VECTOR_DB_PROVIDER: pgvector
      VECTOR_DB_HOST: postgres
      VECTOR_DB_PORT: "5432"
      VECTOR_DB_NAME: cognee
      VECTOR_DB_USERNAME: cognee
      VECTOR_DB_PASSWORD: cognee
      DATA_ROOT_DIRECTORY: /cognee-data/data
      SYSTEM_ROOT_DIRECTORY: /cognee-data/system
    volumes:
      - cognee_data:/cognee-data
    depends_on:
      falkordb:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # Optional: specialist vectors if pgvector is not enough later
  qdrant:
    image: qdrant/qdrant:v1.19.0
    ports:
      - "6334:6333" # offset from cognee_falkordb host 6333
    volumes:
      - qdrant_data:/qdrant/storage
    profiles: ["qdrant"]
    restart: unless-stopped

volumes:
  falkordb_data:
  postgres_data:
  redis_data:
  cognee_data:
  qdrant_data:
