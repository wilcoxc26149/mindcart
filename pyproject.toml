[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mindcart"
version = "0.1.0"
description = "A portable cognitive cartridge for any codebase."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
    "python-dotenv>=1.2.3",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1"]

[project.scripts]
mindcart = "cli.mindcart:main"

[tool.setuptools.packages.find]
include = ["src*", "cli*"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "e2e: host-cartridge end-to-end tests (clone remotes; use --run-e2e)",
    "network: tests that need network access",
]
